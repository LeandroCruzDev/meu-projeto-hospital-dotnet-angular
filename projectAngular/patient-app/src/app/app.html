<main style="max-width: 600px; margin: 40px auto; font-family: sans-serif;"> 
    <h2>Cadastro de Pacientes</h2>

    <div style="margin-bottom: 20px; padding: 15px; border: 1px solid #ccc; border-radius: 8px;">
        <input type="text" [(ngModel)]="newPatient.name" placeholder="Nome do paciente" style="padding: 8px; margin-right: 10px;">
        <input type="text" [(ngModel)]="newPatient.cpf" placeholder="CPF" style="padding: 8px; margin-right: 10px;">
        <button (click)="addPatient()" style="padding: 9px 15px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 4px;">Salvar</button>
    </div>

    <ul style="list-style: none; padding: 0;">
        @for (patient of patients(); track patient.id) {
        <li style="display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid #eee;">
            <span><strong>{{ patient.name }}</strong> (CPF: {{ patient.cpf }})</span>
            <button (click)="deletePatiente(patient.id)" style="color: red; cursor: pointer; background: none; border: none;">Remover</button>
        </li>
    }@empty{
        <p>Nenhum paciente cadastrado ainda.</p>
    }
    </ul>



</main>
