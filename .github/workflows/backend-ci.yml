name: Backend CI (.NET)

on:
  push:
    paths:
      - 'projectsDotnet/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Run Tests
        run: dotnet test projectsDotnet/PatientApi.Tests/PatientApi.Tests.csproj