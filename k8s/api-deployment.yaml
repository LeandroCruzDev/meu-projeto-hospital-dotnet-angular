apiVersion: apps/v1
kind: Deployment
metadata:
  name: patient-api-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: patient-api
  template:
    metadata:
      labels:
        app: patient-api
    spec:
      containers:
      - name: patient-api
        image: patient-api:v1
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: patient-api-service
spec:
  selector:
    app: patient-api
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: ClusterIP