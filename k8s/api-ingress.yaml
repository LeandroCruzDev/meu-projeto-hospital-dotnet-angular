apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: patient-api-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
  - host: hospital.local
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: patient-api-service
            port:
              number: 80